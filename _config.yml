    content: | # this will include new lines to allow paragraphs
      My spouse and I moved to Singapore in 2025 to follow a professional opportunity.  I am taking this opportunity to learn about the Urban Planning practices utilized here, especially as it pertains to urban reiliency, in hopes of applying those lessons to professional settings.
      My academics have focused on Social Sciences, and my professional arc has emphasized operations, building and growing teams, managing director and vendor relationships, and always viewing situations through the lense of fincancially sustainable choices coupled with what is in the best interest of end users, employees, and the business as an institution.

