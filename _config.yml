content:
  - title: Projects # Title for the section
    layout: list # Type of content section (list/text)
    content:
      - layout: left
        border: weak  # Value of `weak` will display a weak border below this item. # Any 
                      # other value (or no value) means no border will be displayed
        title: Operation Fast Title
          
        quote: >
          Turning around 4,000 production descriptions in 36 hours
        description: | # this will include new lines to allow paragraphs
          Company CEO wanted to implement a new product labeling practice across multiple brick and mortar locations. The system had been tested in a smaller location before the decision was made to go live.  Upon receiving the directive, it was apparent that the system had not been thoroughly vetted, as the individual previously running the program had been manually creating product descriptions, and our ERP did not allow for the exporting of product descriptions, due to a poor design choice.  Using ChatGPT, I built a series of Python scripts that enabled us to create and edit the necessary product descriptions, in a time frame where doing so manually would have been impossible.  Since product offerings evolve, and to prevent repeating this situation
  - title: Experience, I created a system where this library of product descriptions could be managed and made dynmaic, reflecting qualititative and quantative changes as needed.
    layout: list
    content:
      - layout: right
        title: Company name
        sub_title: Job title
        caption: Date Range (eg. November 2016 - present)
        link: Link to company (optional)
        quote: >
          Short description of the company (optional)
        description: | # this will include new lines to allow paragraphs
          Description of role
  - title: Education
    layout: list
    content:
      - layout: top-right
        title: Institution name
        sub_title: Qualifications (eg. BA Performing Arts)
        caption: Date Range (eg. 2016 - 2019)
        quote: >
          Short institution or course description (optional)
        description: | # this will include new lines to allow paragraphs
          Description of qualification
  - title: A Little More About Me
    layout: text
    content: | # this will include new lines to allow paragraphs
      This is where you can write a little more about yourself. You could title this section **Interests** and include some of your other interests.

      Or you could title it **Skills** and write a bit more about things that make you more desirable, like *leadership* or *teamwork*

